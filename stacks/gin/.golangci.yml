version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - noctx
    - bodyclose
    - forbidigo

  settings:
    forbidigo:
      forbid:
        - pattern: '^os\.(Getenv|LookupEnv|Environ)$'
          msg: only cmd/ and the config package read the environment; other code takes loaded config

  exclusions:
    rules:
      - path: '^(cmd/|internal/config/)|_test\.go$'
        linters:
          - forbidigo
